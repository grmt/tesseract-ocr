name: Build and push

# Keeps the tesseract-ocr image (python:3-alpine + tesseract-ocr + Dutch
# tessdata_best model) current with upstream Python/Alpine security fixes
# without anyone having to remember to rebuild it.
#
# Runs on a schedule and always builds with --pull: if the upstream base
# hasn't changed, the resulting image is bit-for-bit identical and the push
# is a no-op (same digest, no new layers stored). No separate "did the base
# change" check is needed -- GHCR/Docker already dedupe on digest.

on:
  schedule:
    - cron: '0 3 * * *' # daily, 03:00 UTC
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - Dockerfile
      - ocr_server.py
      - .github/workflows/build.yml

permissions:
  contents: read
  packages: write

jobs:
  build-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          pull: true
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/tesseract-ocr:latest
